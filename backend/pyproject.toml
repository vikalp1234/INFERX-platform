[project]
name = "inferx-backend"
version = "0.0.0"
description = "INFERX backend (pre-release skeleton)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.15.0",
    "transformers>=5.24.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not model'"
markers = ["model: needs the ml extra, network and a downloaded model"]

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "import-linter>=2.17",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
